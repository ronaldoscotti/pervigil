name: Release

# Signed, notarized, auto-updatable releases. Normally called by the release-please
# workflow when a release PR merges; `on: push: tags` stays as the manual escape
# hatch. Never runs on fork pull requests, so signing secrets are never exposed to
# untrusted code.
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: The version tag to build and publish.
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple silicon
            target: aarch64-apple-darwin
            gate: true
          # Intel. `macos-13` was retired in December 2025 and the job sat queued
          # against a pool that no longer exists — silently, because a queued job
          # never fails. GitHub drops x86_64 macOS entirely in late 2027; the
          # upgrade path then is cross-compiling this target from the arm64 runner.
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            gate: true
          - platform: windows-latest
            target: ""
            gate: false
          - platform: ubuntu-22.04
            target: ""
            gate: false
    runs-on: ${{ matrix.platform }}
    # macOS is the tested target and gates the release; Windows and Linux are
    # architecturally supported and allowed to fail until someone owns them.
    continue-on-error: ${{ !matrix.gate }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Import Apple signing certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/app.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing + notarization (macOS only; empty elsewhere).
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater artifact signing (all platforms) — produces latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Specola ${{ inputs.tag || github.ref_name }}"
          # Published straight away: a draft does not resolve at
          # `releases/latest/download/latest.json`, so a drafted release is invisible
          # to every installed client until someone clicks Publish.
          releaseDraft: false
          # Must stay false: the updater endpoint is
          # `releases/latest/download/latest.json`, and GitHub's `latest`
          # resolution skips pre-releases — marking releases pre-release 404s
          # every installed client. Pre-1.0 status is signalled in the README
          # banner, the release body, and the 0.x version instead.
          prerelease: false
          # Keyed on file suffix, not full filename, so it survives version bumps.
          releaseBody: |
            ## Which file do I download?

            | If you're on | Download the file ending in |
            |---|---|
            | **macOS**, Apple silicon (M1–M4) | `_aarch64.dmg` |
            | **macOS**, Intel | `_x64.dmg` |
            | **Windows** | `_x64-setup.exe` |
            | **Linux** — anything | `_amd64.AppImage` (`chmod +x` and run, no install) |
            | **Linux** — Debian/Ubuntu | `_amd64.deb` |
            | **Linux** — Fedora/RHEL | `.x86_64.rpm` |

            Everything else in the list — `latest.json`, `.app.tar.gz`, and every
            `.sig` file — is auto-updater plumbing. You don't need to download any
            of it.

            ### Before you install

            **macOS** is signed and notarized; it opens normally.

            **Windows** is not code-signed yet, so SmartScreen shows *"Windows
            protected your PC"*. To install anyway: **More info → Run anyway**. If
            that's not a trade you want to make, build from source — same code.

            **Windows and Linux have never run on a maintainer's machine.** They're
            built from this same pipeline and the platform code is real, but macOS is
            the only tested target. If you try either, a
            [platform test report](https://github.com/ronaldoscotti/specola/issues/new?template=platform_test.yml)
            is the most useful thing you can send this project — partial reports very
            much included.

            ### After you install

            Open **Settings** in the panel and paste the hook snippet it shows into
            `~/.claude/settings.json`. Specola never edits that file for you. The
            install card disappears once the hooks are detected.
          # The bundle-only config carries externalBin so the record shim ships
          # inside the app; the target keeps host == target for the sidecar.
          args: >-
            --config src-tauri/tauri.bundle.conf.json
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
