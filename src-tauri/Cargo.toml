[package]
name = "pervigil"
version = "0.1.0"
description = "Cross-platform panel showing which Claude Code sessions are waiting on you"
authors = ["Ronaldo Scotti"]
edition = "2021"
# The `record` shim is a second binary; without this, `cargo run` (and `tauri dev`)
# can't tell which one is the app.
default-run = "pervigil"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pervigil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }


[[bin]]
name = "record"
path = "bin/record.rs"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
